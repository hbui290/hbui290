<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 130" width="100%" height="130" style="background: transparent;">
  <defs>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007AFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1F2937" stop-opacity="0.3" />
    </linearGradient>
    
    <clipPath id="clip1">
      <rect id="clip-rect1" x="0" y="-22" width="0" height="32" />
    </clipPath>
    <clipPath id="clip2">
      <rect id="clip-rect2" x="0" y="-22" width="0" height="32" />
    </clipPath>
    <clipPath id="clip3">
      <rect id="clip-rect3" x="0" y="-22" width="0" height="32" />
    </clipPath>
  </defs>

  <style>
    .terminal-bg {
      fill: #0B0F19;
      stroke: url(#border-grad);
      stroke-width: 1.5;
    }
    .prompt-text {
      font-family: 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 16px;
      fill: #00E5FF; /* High-contrast Neon Cyan */
      font-weight: bold;
    }
    .code-text {
      font-family: 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 16px;
      fill: #FFFFFF; /* Crisp White */
      font-weight: 500;
    }
    .cursor {
      animation: blink 0.8s infinite;
    }
    
    /* Animation Timing */
    .group1 {
      animation: group1-fade 15s infinite;
    }
    .group2 {
      animation: group2-fade 15s infinite;
    }
    .group3 {
      animation: group3-fade 15s infinite;
    }
    
    #clip-rect1 {
      animation: type1 15s infinite;
    }
    .cursor1 {
      animation: cursor-move1 15s infinite, blink 0.8s infinite;
    }
    
    #clip-rect2 {
      animation: type2 15s infinite;
    }
    .cursor2 {
      animation: cursor-move2 15s infinite, blink 0.8s infinite;
    }
    
    #clip-rect3 {
      animation: type3 15s infinite;
    }
    .cursor3 {
      animation: cursor-move3 15s infinite, blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Group Fades */
    @keyframes group1-fade {
      0%, 33.2% { opacity: 1; }
      33.3%, 100% { opacity: 0; }
    }
    @keyframes group2-fade {
      0%, 33.2% { opacity: 0; }
      33.3%, 66.5% { opacity: 1; }
      66.6%, 100% { opacity: 0; }
    }
    @keyframes group3-fade {
      0%, 66.5% { opacity: 0; }
      66.6%, 99.9% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* Typing Width Animations (Font size 16px -> 1ch = ~9.6px) */
    @keyframes type1 {
      0% { width: 0; }
      1.5% { width: 0; animation-timing-function: steps(32); }
      11.5% { width: 307px; } /* type in 1.5s */
      23.3% { width: 307px; animation-timing-function: steps(32); } /* hold */
      30.0% { width: 0; } /* erase */
      33.3%, 100% { width: 0; }
    }
    
    @keyframes type2 {
      0%, 33.3% { width: 0; }
      34.8% { width: 0; animation-timing-function: steps(45); }
      44.8% { width: 432px; } /* type in 1.5s */
      56.6% { width: 432px; animation-timing-function: steps(45); } /* hold */
      63.3% { width: 0; } /* erase */
      66.6%, 100% { width: 0; }
    }
    
    @keyframes type3 {
      0%, 66.6% { width: 0; }
      68.1% { width: 0; animation-timing-function: steps(34); }
      79.8% { width: 326px; } /* type in 1.75s */
      90.0% { width: 326px; animation-timing-function: steps(34); } /* hold */
      96.6% { width: 0; } /* erase */
      100% { width: 0; }
    }

    /* Cursor Position Animations */
    @keyframes cursor-move1 {
      0% { transform: translateX(0); }
      1.5% { transform: translateX(0); animation-timing-function: steps(32); }
      11.5% { transform: translateX(307px); }
      23.3% { transform: translateX(307px); animation-timing-function: steps(32); }
      30.0% { transform: translateX(0); }
      33.3%, 100% { transform: translateX(0); }
    }
    
    @keyframes cursor-move2 {
      0%, 33.3% { transform: translateX(0); }
      34.8% { transform: translateX(0); animation-timing-function: steps(45); }
      44.8% { transform: translateX(432px); }
      56.6% { transform: translateX(432px); animation-timing-function: steps(45); }
      63.3% { transform: translateX(0); }
      66.6%, 100% { transform: translateX(0); }
    }
    
    @keyframes cursor-move3 {
      0%, 66.6% { transform: translateX(0); }
      68.1% { transform: translateX(0); animation-timing-function: steps(34); }
      79.8% { transform: translateX(326px); }
      90.0% { transform: translateX(326px); animation-timing-function: steps(34); }
      96.6% { transform: translateX(0); }
      100% { transform: translateX(0); }
    }
  </style>

  <!-- Terminal window background with rounded corners -->
  <rect class="terminal-bg" x="1" y="1" width="798" height="128" rx="8" />

  <!-- Mac Title Bar -->
  <circle cx="20" cy="18" r="6" fill="#FF5F56" />
  <circle cx="38" cy="18" r="6" fill="#FFBD2E" />
  <circle cx="56" cy="18" r="6" fill="#27C93F" />
  <line x1="1" y1="35" x2="799" y2="35" stroke="#1F2937" stroke-width="1.0" />

  <!-- Animated Groups -->
  <!-- Sequence 1 -->
  <g class="group1">
    <text class="prompt-text" x="25" y="80" textLength="115" lengthAdjust="spacingAndGlyphs">winston ~ % </text>
    <g transform="translate(145, 80)">
      <text class="code-text" textLength="307" lengthAdjust="spacingAndGlyphs" clip-path="url(#clip1)">Degen | Web3 Builder | AI Newbie</text>
      <rect class="cursor cursor1" x="0" y="-13" width="8" height="16" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Sequence 2 -->
  <g class="group2">
    <text class="prompt-text" x="25" y="80" textLength="115" lengthAdjust="spacingAndGlyphs">winston ~ % </text>
    <g transform="translate(145, 80)">
      <text class="code-text" textLength="432" lengthAdjust="spacingAndGlyphs" clip-path="url(#clip2)">5+ yrs shipping products, scaling communities</text>
      <rect class="cursor cursor2" x="0" y="-13" width="8" height="16" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Sequence 3 -->
  <g class="group3">
    <text class="prompt-text" x="25" y="80" textLength="115" lengthAdjust="spacingAndGlyphs">winston ~ % </text>
    <g transform="translate(145, 80)">
      <text class="code-text" textLength="326" lengthAdjust="spacingAndGlyphs" clip-path="url(#clip3)">Trying to build my own Jarvis &lt; /&gt;</text>
      <rect class="cursor cursor3" x="0" y="-13" width="8" height="16" fill="#FFFFFF" />
    </g>
  </g>
</svg>
