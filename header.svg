<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 140" width="100%" height="140" style="background: transparent;">
  <defs>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007AFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1F2937" stop-opacity="0.3" />
    </linearGradient>
    
    <clipPath id="clip1">
      <rect id="clip-rect1" x="0" y="-20" width="0" height="30" />
    </clipPath>
    <clipPath id="clip2">
      <rect id="clip-rect2" x="0" y="-20" width="0" height="30" />
    </clipPath>
    <clipPath id="clip3">
      <rect id="clip-rect3" x="0" y="-20" width="0" height="30" />
    </clipPath>
  </defs>

  <style>
    .terminal-bg {
      fill: #0B0F19;
      stroke: url(#border-grad);
      stroke-width: 1.5;
    }
    .title-text {
      font-family: 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 12px;
      fill: #4B5563;
    }
    .prompt-text {
      font-family: 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 18px;
      fill: #007AFF;
      font-weight: bold;
    }
    .code-text {
      font-family: 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 18px;
      fill: #FFFFFF;
    }
    .output-text {
      font-family: 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 18px;
      fill: #FFFFFF;
    }
    .cursor {
      animation: blink 0.8s infinite;
    }
    
    /* Animation Timing */
    .group1 {
      animation: group1-fade 15s infinite;
    }
    .group2 {
      animation: group2-fade 15s infinite;
    }
    .group3 {
      animation: group3-fade 15s infinite;
    }
    
    #clip-rect1 {
      animation: type1 15s infinite;
    }
    .cursor1 {
      animation: cursor-move1 15s infinite, blink 0.8s infinite;
    }
    .output1 {
      animation: output1-fade 15s infinite;
    }
    
    #clip-rect2 {
      animation: type2 15s infinite;
    }
    .cursor2 {
      animation: cursor-move2 15s infinite, blink 0.8s infinite;
    }
    .output2 {
      animation: output2-fade 15s infinite;
    }
    
    #clip-rect3 {
      animation: type3 15s infinite;
    }
    .cursor3 {
      animation: cursor-move3 15s infinite, blink 0.8s infinite;
    }
    .output3 {
      animation: output3-fade 15s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Group Fades */
    @keyframes group1-fade {
      0%, 26.6% { opacity: 1; }
      30.0%, 100% { opacity: 0; }
    }
    @keyframes group2-fade {
      0%, 33.2% { opacity: 0; }
      33.3%, 60.0% { opacity: 1; }
      63.3%, 100% { opacity: 0; }
    }
    @keyframes group3-fade {
      0%, 66.5% { opacity: 0; }
      66.6%, 93.3% { opacity: 1; }
      96.6%, 100% { opacity: 0; }
    }

    /* Typing Width Animations */
    @keyframes type1 {
      0% { width: 0; }
      0.5% { width: 0; animation-timing-function: steps(6); }
      8.0% { width: 66px; } /* type in 1.2s (from 0s to 1.2s) */
      100% { width: 66px; }
    }
    
    @keyframes type2 {
      0%, 33.3% { width: 0; }
      33.8% { width: 0; animation-timing-function: steps(12); }
      41.3% { width: 132px; } /* type in 1.2s (from 5.0s to 6.2s) */
      100% { width: 132px; }
    }
    
    @keyframes type3 {
      0%, 66.6% { width: 0; }
      67.1% { width: 0; animation-timing-function: steps(3); }
      74.6% { width: 33px; } /* type in 1.2s (from 10.0s to 11.2s) */
      100% { width: 33px; }
    }

    /* Cursor Position Animations */
    @keyframes cursor-move1 {
      0% { transform: translateX(0); }
      0.5% { transform: translateX(0); animation-timing-function: steps(6); }
      8.0% { transform: translateX(66px); }
      100% { transform: translateX(66px); }
    }
    
    @keyframes cursor-move2 {
      0%, 33.3% { transform: translateX(0); }
      33.8% { transform: translateX(0); animation-timing-function: steps(12); }
      41.3% { transform: translateX(132px); }
      100% { transform: translateX(132px); }
    }
    
    @keyframes cursor-move3 {
      0%, 66.6% { transform: translateX(0); }
      67.1% { transform: translateX(0); animation-timing-function: steps(3); }
      74.6% { transform: translateX(33px); }
      100% { transform: translateX(33px); }
    }

    /* Output Fade-in Animations */
    @keyframes output1-fade {
      0%, 10.0% { opacity: 0; } /* invisible until 1.5s */
      13.3%, 100% { opacity: 1; }
    }
    @keyframes output2-fade {
      0%, 43.3% { opacity: 0; } /* invisible until 6.5s */
      46.6%, 100% { opacity: 1; }
    }
    @keyframes output3-fade {
      0%, 76.6% { opacity: 0; } /* invisible until 11.5s */
      80.0%, 100% { opacity: 1; }
    }
  </style>

  <!-- Terminal window background with rounded corners -->
  <rect class="terminal-bg" x="1" y="1" width="798" height="138" rx="8" />

  <!-- Mac Title Bar -->
  <circle cx="20" cy="18" r="6" fill="#FF5F56" />
  <circle cx="38" cy="18" r="6" fill="#FFBD2E" />
  <circle cx="56" cy="18" r="6" fill="#27C93F" />
  <text class="title-text" x="400" y="22" text-anchor="middle">hbui290@terminal:~</text>
  <line x1="1" y1="35" x2="799" y2="35" stroke="#1F2937" stroke-width="1.0" />

  <!-- Animated Groups -->
  <!-- Sequence 1: whoami -->
  <g class="group1">
    <text class="prompt-text" x="25" y="70" textLength="132" lengthAdjust="spacingAndGlyphs">winston ~ % </text>
    <g transform="translate(165, 70)">
      <text class="code-text" textLength="66" lengthAdjust="spacingAndGlyphs" clip-path="url(#clip1)">whoami</text>
      <rect class="cursor cursor1" x="0" y="-15" width="8" height="18" fill="#007AFF" />
    </g>
    <text class="output-text output1" x="25" y="105" textLength="352" lengthAdjust="spacingAndGlyphs">Degen | Web3 Builder | AI Newbie</text>
  </g>

  <!-- Sequence 2: track_record -->
  <g class="group2">
    <text class="prompt-text" x="25" y="70" textLength="132" lengthAdjust="spacingAndGlyphs">winston ~ % </text>
    <g transform="translate(165, 70)">
      <text class="code-text" textLength="132" lengthAdjust="spacingAndGlyphs" clip-path="url(#clip2)">track_record</text>
      <rect class="cursor cursor2" x="0" y="-15" width="8" height="18" fill="#007AFF" />
    </g>
    <text class="output-text output2" x="25" y="105" textLength="330" lengthAdjust="spacingAndGlyphs">5+ yrs shipping &amp; scaling Web3</text>
  </g>

  <!-- Sequence 3: now -->
  <g class="group3">
    <text class="prompt-text" x="25" y="70" textLength="132" lengthAdjust="spacingAndGlyphs">winston ~ % </text>
    <g transform="translate(165, 70)">
      <text class="code-text" textLength="33" lengthAdjust="spacingAndGlyphs" clip-path="url(#clip3)">now</text>
      <rect class="cursor cursor3" x="0" y="-15" width="8" height="18" fill="#007AFF" />
    </g>
    <text class="output-text output3" x="25" y="105" textLength="374" lengthAdjust="spacingAndGlyphs">Hands-on with the agentic AI world</text>
  </g>
</svg>
